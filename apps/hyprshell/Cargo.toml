[package]
name = "hyprshell"
version.workspace = true
edition.workspace = true

[lib]

[[bin]]
name = "hyprshell"
path = "src/main.rs"

[dependencies]
telar = { workspace = true, features = [
    "dynamic-svg",
    "async-assets",
    "preview-headless",
] }
platform-wayland = { workspace = true }
config = { workspace = true }
services = { workspace = true }
ui = { workspace = true }
surfaces = { workspace = true }
modules = { workspace = true }
settings = { workspace = true }
util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
fontdb = "0.23"
tracing-appender = "0.2.5"

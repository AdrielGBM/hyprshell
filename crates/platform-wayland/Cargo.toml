[package]
name = "platform-wayland"
description = "A Wayland backend for a desktop shell: layer surfaces, session lock, idle notification, screen capture and clipboard ownership, over one connection and one event loop."
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
telar = { workspace = true }
smithay-client-toolkit = { workspace = true }
wayland-client = { workspace = true, features = ["log"] }
raw-window-handle = { workspace = true }
tracing = "0.1"
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }

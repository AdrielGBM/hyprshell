[workspace]
resolver = "3"
members = [
    "crates/platform-layershell",
    "crates/util",
    "crates/config",
    "crates/services",
    "crates/ui",
    "crates/surfaces",
    "crates/modules",
    "crates/settings",
    "apps/hyprshell",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
platform-layershell = { path = "crates/platform-layershell" }
util = { package = "hyprshell-util", path = "crates/util", version = "0.1.0" }
config = { package = "hyprshell-config", path = "crates/config", version = "0.1.0" }
services = { package = "hyprshell-services", path = "crates/services", version = "0.1.0" }
ui = { package = "hyprshell-ui", path = "crates/ui", version = "0.1.0" }
surfaces = { package = "hyprshell-surfaces", path = "crates/surfaces", version = "0.1.0" }
modules = { package = "hyprshell-modules", path = "crates/modules", version = "0.1.0" }
settings = { package = "hyprshell-settings", path = "crates/settings", version = "0.1.0" }
platform-headless = { package = "telar-platform-headless", path = "../telar/crates/platform/platform-headless" }
telar = { path = "../telar/crates/telar", default-features = false, features = [
    "runtime",
    "components",
] }
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
raw-window-handle = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
] }
libc = "0.2.189"
libloading = "0.9.0"
rustfft = "6.4.1"
rustix = { version = "1.1.4", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
toml = "1"
toml_edit = "0.25.13"
tracing = "0.1"
ureq = "3.3.0"
zbus = "5.17.0"

[profile.release]
lto = "thin"
codegen-units = 1
